# ============================================================
# Cấu hình môi trường PROD - Sử dụng MySQL 8
# Kích hoạt: SPRING_PROFILES_ACTIVE=prod
# ============================================================

spring:
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:wms_db}?useUnicode=true&characterEncoding=utf8&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Ho_Chi_Minh
    username: ${DB_USER:root}
    password: ${DB_PASSWORD:password123}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000
      pool-name: HikariPool-PROD

  jpa:
    hibernate:
      ddl-auto: update         # PROD
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true
        jdbc:
          batch_size: 50

  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${MAIL_SMTP_AUTH:true}
          starttls:
            enable: ${MAIL_SMTP_STARTTLS:true}

ai:
  llm:
    enabled: ${AI_ENABLED:true}
    api-key: ${GEMINI_API_KEY:}
    base-url: ${GEMINI_BASE_URL:https://generativelanguage.googleapis.com/v1beta}
    model: ${GEMINI_MODEL:gemini-3.8-flash}
    max-tokens: ${GEMINI_MAX_TOKENS:1000}
    temperature: ${GEMINI_TEMPERATURE:0.1}
    timeout-ms: ${GEMINI_TIMEOUT_MS:30000}

# Cấu hình Logging (PROD - tối giản)
logging:
  level:
    root: WARN
    com.wms: INFO
