server:
  port: 8080
  servlet:
    context-path: /api/v1

spring:
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  flyway:
    enabled: ${FLYWAY_ENABLED:true}
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 4
    baseline-description: Baseline existing smart-wms schema
    out-of-order: false
    validate-on-migrate: true
