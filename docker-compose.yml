services:
  # 1. Cơ sở dữ liệu MySQL 8
  wms-mysql:
    image: mysql:8.0
    container_name: wms-mysql
    restart: always
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci --default-authentication-plugin=mysql_native_password
    environment:
      MYSQL_DATABASE: wms_db
      MYSQL_ROOT_PASSWORD: password123
    ports:
      - "3307:3306"
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -ppassword123 --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    volumes:
      - wms_mysqldata:/var/lib/mysql
      - ./docker/mysql/init:/docker-entrypoint-initdb.d
    networks:
      - wms-net

  # 2. Hàng đợi thông điệp RabbitMQ (Hỗ trợ Management Web UI)
  wms-rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: wms-rabbitmq
    restart: always
    ports:
      - "5672:5672"     # AMQP protocol
      - "15672:15672"   # Management Dashboard
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    volumes:
      - ./docker/rabbitmq/rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf:ro
      - ./docker/rabbitmq/definitions.json:/etc/rabbitmq/definitions.json:ro
      - wms_mqdata:/var/lib/rabbitmq
    networks:
      - wms-net

  # 3. Lưu trữ đối tượng MinIO (Tương thích chuẩn AWS S3)
  wms-minio:
    image: quay.io/minio/minio:latest
    container_name: wms-minio
    restart: always
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"     # S3 API
      - "9001:9001"     # Web Console
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - wms_miniodata:/data
    networks:
      - wms-net

  # 4. Redis In-Memory Cache (Rate-Limiting & JWT Blacklist Distributed)
  wms-redis:
    image: redis:7-alpine
    container_name: wms-redis
    restart: always
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    volumes:
      - wms_redisdata:/data
    networks:
      - wms-net

  # 5. Backend Spring Boot 3
  wms-backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: wms-backend
    restart: always
    depends_on:
      wms-mysql:
        condition: service_healthy
      wms-rabbitmq:
        condition: service_healthy
      wms-minio:
        condition: service_started
      wms-redis:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_HOST: wms-mysql
      DB_PORT: 3306
      DB_NAME: wms_db
      DB_USER: root
      DB_PASSWORD: password123
      REDIS_HOST: wms-redis
      REDIS_PORT: 6379
      RABBITMQ_HOST: wms-rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USER: guest
      RABBITMQ_PASS: guest
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.8-flash}
      GEMINI_BASE_URL: ${GEMINI_BASE_URL:-https://generativelanguage.googleapis.com/v1beta}
      GEMINI_MAX_TOKENS: ${GEMINI_MAX_TOKENS:-1000}
      GEMINI_TEMPERATURE: ${GEMINI_TEMPERATURE:-0.1}
      GEMINI_TIMEOUT_MS: ${GEMINI_TIMEOUT_MS:-30000}
      MINIO_ENDPOINT: http://wms-minio:9000
      MAIL_HOST: ${MAIL_HOST:-smtp.gmail.com}
      MAIL_PORT: ${MAIL_PORT:-587}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      MAIL_SMTP_AUTH: ${MAIL_SMTP_AUTH:-true}
      MAIL_SMTP_STARTTLS: ${MAIL_SMTP_STARTTLS:-true}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
    ports:
      - "8080:8080"
    networks:
      - wms-net

  # 6. Frontend React 18 + Nginx
  wms-frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: wms-frontend
    restart: always
    depends_on:
      - wms-backend
    ports:
      - "3000:80"
    networks:
      - wms-net

volumes:
  # Đặt tên cố định để đổi tên thư mục/project Compose không tạo DB volume mới.
  # Volume hiện tại của dự án là: hkdn_wms_mysqldata
  wms_mysqldata:
    name: hkdn_wms_mysqldata
  wms_mqdata:
  wms_miniodata:
  wms_redisdata:

networks:
  wms-net:
    driver: bridge
