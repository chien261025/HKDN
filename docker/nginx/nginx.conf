events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Rate Limiting: Giới hạn 20 req/s cho mỗi IP để chống DDoS
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=20r/s;

    server {
        listen 80;
        server_name localhost;

        # Frontend React App tĩnh
        location / {
            root   /usr/share/nginx/html;
            index  index.html index.htm;
            try_files $uri $uri/ /index.html;
        }

        # Định tuyến ngược (Reverse Proxy) API tới Spring Boot Backend
        location /api/ {
            limit_req zone=api_limit burst=10 nodelay;

            proxy_pass http://wms-backend:8080/api/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Hỗ trợ timeout lớn cho các tác vụ xuất dữ liệu
            proxy_read_timeout 300s;
            proxy_connect_timeout 75s;
        }
    }
}
