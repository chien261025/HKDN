<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5" />
      <stop offset="50%" stop-color="#4338ca" />
      <stop offset="100%" stop-color="#312e81" />
    </linearGradient>

    <!-- Top Isometric Face -->
    <linearGradient id="topFace" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c7d2fe" />
      <stop offset="100%" stop-color="#a5b4fc" />
    </linearGradient>

    <!-- Left Isometric Face -->
    <linearGradient id="leftFace" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>

    <!-- Right Isometric Face -->
    <linearGradient id="rightFace" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5" />
      <stop offset="100%" stop-color="#3730a3" />
    </linearGradient>

    <!-- Inner Glow Filter -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#1e1b4b" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Base Rounded Container with subtle border -->
  <rect x="6" y="6" width="116" height="116" rx="28" fill="url(#bgGrad)" stroke="#6366f1" stroke-width="2" filter="url(#shadow)" />

  <!-- 3D Isometric Warehouse Cube Logo -->
  <g transform="translate(64, 52)">
    <!-- Top Rhombus -->
    <path d="M 0 -28 L 32 -10 L 0 8 L -32 -10 Z" fill="url(#topFace)" />
    <!-- Left Polygon -->
    <path d="M -32 -10 L 0 8 L 0 42 L -32 24 Z" fill="url(#leftFace)" />
    <!-- Right Polygon -->
    <path d="M 0 8 L 32 -10 L 32 24 L 0 42 Z" fill="url(#rightFace)" />

    <!-- Center Monogram "W" Accent in White -->
    <path d="M -18 2 L -12 28 L -5 10 L 5 10 L 12 28 L 18 2" 
          fill="none" 
          stroke="#ffffff" 
          stroke-width="5" 
          stroke-linecap="round" 
          stroke-linejoin="round" />
  </g>

  <!-- Live Status Emerald Dot (Bottom Right) -->
  <circle cx="100" cy="100" r="12" fill="#10b981" stroke="#ffffff" stroke-width="3.5" />
  <circle cx="100" cy="100" r="5" fill="#ffffff" opacity="0.9" />

  <!-- Subtle Copyright / Registered Trademark 'R' Badge (Top Right) -->
  <circle cx="104" cy="24" r="8" fill="#312e81" stroke="#818cf8" stroke-width="1.5" />
  <text x="104" y="27.5" font-family="Arial, sans-serif" font-size="9" font-weight="bold" fill="#c7d2fe" text-anchor="middle">R</text>
</svg>
